name: h1-loco-manipulation-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install mujoco numpy pytest
      - run: cd submissions/h1-loco-manipulation && python validate_submission.py
      - run: cd submissions/h1-loco-manipulation && python -m pytest tests/ -v
